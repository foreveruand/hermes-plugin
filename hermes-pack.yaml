# Hermes 插件包：一键安装本仓库的全部插件（每个条目钉死到确切提交）。
# 用法（在本文件所在目录）：
#   hermes plugins pack show ./hermes-pack.yaml     # 先预览
#   hermes plugins pack install ./hermes-pack.yaml  # 审阅后确认安装
# 注意：pack 的 ref 必须是 40 位完整 commit SHA（分支名/标签会被拒绝）。
# 插件代码有更新时，把对应条目的 ref 换成新提交的 SHA 再提交本文件。

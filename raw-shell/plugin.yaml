name: raw-shell
version: 1.1.0
description: >-
  /raw <command> (alias /shell) — run a shell command with arguments directly
  on the gateway host from any chat (Telegram, Discord, CLI, ...), without
  invoking the LLM. Use /shell when a legacy quick_commands.raw entry shadows
  /raw. There is no per-plugin user allowlist: anyone who can reach the
  gateway can run it, so restrict access with the gateway's own pairing /
  allowed-users settings.
author: foreveruand
requires_hermes: ">=0.22.3"
provides_tools: []
provides_hooks: []
provides_middleware: []

name: media-downloader
version: "1.3.0"
description: "Unified yt-dlp / gallery-dl downloader plus an ASMR.ONE pipeline, with an encrypted bdpan handoff that other hosts can import via /dl."
author: "custom"
provides_tools:
  - media_download
provides_hooks: []
provides_middleware: []
python_dependencies:
  - "httpx>=0.28.1,<1"
  - "dvtag>=0.7.8,<0.8"
config_schema:
  config_dir:
    type: string
    description: "Central configuration, archive and ASMR track-cache directory"
  staging_base:
    type: string
    description: "Staging directory used before files are moved into the archive"
  staging_fallback:
    type: string
    description: "Fallback staging directory when the primary staging mount is unavailable"
  default_proxy:
    type: string
    description: "Proxy used for non-domestic domains"
  domestic_domains:
    type: array
    items:
      type: string
    description: "Domains that bypass the proxy and connect directly"
  destinations:
    type: object
    description: "Archive destination per content category: asmr (general works), asmr_r (R18 works), bilibili, pixiv, extract. Interpretation follows upload_mode: a local path (local), a remote spec remote:path (rclone), or unused (bdpan). On a receiving host these values are also the import roots for /dl HMD1 handoff codes, and may be local paths or rclone specs independently of the uploader's bdpan mode."
  upload_mode:
    type: string
    description: "Post-download upload backend: local (move into a local directory), rclone (transfer to a remote spec) or bdpan (pack into an encrypted 7z and upload to Baidu Netdisk). Mutually exclusive; default local."
  rclone:
    type: object
    description: "Remote transfer settings used when upload_mode is rclone"
  bdpan:
    type: object
    description: "Baidu Netdisk settings used when upload_mode is bdpan: bin, remote_dir (relative to /apps/bdpan/), seven_zip_bin, password_length, archive_suffix_len, compress_level, seven_zip_flags, agentname, timeout_seconds"
  asmr:
    type: object
    description: "ASMR.ONE download settings: api_base, hq_only, file_types, blacklist, max_concurrent_downloads, request_timeout_seconds, download_attempts, dvtag_timeout_seconds"
  tasks_dir:
    type: string
    description: "Directory storing background task records"
